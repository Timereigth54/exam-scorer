<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reading & Listening · Exam Prep</title>
<style>
:root{--ink:#1f36a8;--text:#1b2233;--muted:#55607a;--cover:#a4201a;color:var(--text);font:17px/1.55 system-ui,sans-serif;background:#e9eff7}
*{box-sizing:border-box}body{margin:0}header,main{max-width:1240px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}a{color:var(--ink)}button,input,select{font:inherit}button,select,input{min-height:48px;border:1px solid #9cabc2;border-radius:6px;padding:10px 14px;background:white;color:var(--text)}button{cursor:pointer}button.primary{background:var(--ink);color:white;border-color:var(--ink)}button:disabled{opacity:.55;cursor:default}:focus-visible{outline:3px solid #1f36a8;outline-offset:3px}h1,h2,h3,p{margin-top:0}h1{font:700 clamp(2.1rem,7vw,3.2rem)/1.15 'Segoe Print',cursive;color:var(--cover)}.paper{background-color:#f8fbff;background-image:linear-gradient(#d3e3f5 1px,transparent 1px),linear-gradient(90deg,#d3e3f5 1px,transparent 1px);background-size:24px 24px;border-top:6px solid var(--cover);padding:28px;border-radius:8px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}.cover{display:block;background:var(--cover);color:white;padding:36px 24px;text-decoration:none;border-radius:8px;min-height:180px;font-size:1.6rem}.cover small{display:block;font-size:1rem;margin-top:20px}.muted{color:var(--muted)}.toolbar{display:flex;align-items:end;flex-wrap:wrap;gap:14px;margin-bottom:24px}.toolbar label{display:grid;gap:5px}.spread{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}img{max-width:100%;height:auto;background:white}.passage{white-space:pre-wrap;overflow-wrap:anywhere}.question{background:#fff;padding:18px;margin:0 0 16px;border:1px solid #d3e3f5;border-radius:6px}.choice{display:flex;gap:12px;align-items:center;min-height:48px}.choice input{min-height:24px;width:22px}.question input[type=text]{width:100%;max-width:400px}.result-line{padding:10px 0;border-bottom:1px solid #d3e3f5}.right{color:#17625e}.wrong{color:#a4201a}.waiting{color:#8a4b00}fieldset{border:0;padding:0;margin:0;min-width:0}.tabs{display:none}.notice{padding:14px;background:white;border:1px solid #9cabc2;border-radius:8px;margin:14px 0}dialog{max-width:440px;border:1px solid #9cabc2;border-radius:8px;padding:28px}dialog::backdrop{background:#1b223370}.actions{display:flex;gap:12px;flex-wrap:wrap}summary{cursor:pointer;padding:12px 0;min-height:44px}[hidden]{display:none!important}@media(max-width:899px){header,main{padding:16px}.paper{padding:18px}.spread{grid-template-columns:1fr}.tabs{display:flex;gap:10px;margin-bottom:18px}.spread[data-tab=questions] .text-side,.spread[data-tab=text] .question-side{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
header{position:sticky;top:0;z-index:10;background:#e9eff7;border-bottom:3px solid var(--cover)}header a,.actions>a,.toolbar>a{display:inline-flex;align-items:center;min-height:44px}#headerClock{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header><a href="index.html">Exam Prep</a><span id="identity">Reading & Listening</span><span id="headerClock" role="timer" aria-label="Elapsed time" hidden></span></header>
<main><div class="toolbar"><label>Your student code<input id="code" autocomplete="off" placeholder="ABC-123" maxlength="20"></label><button id="progress">Your progress</button><a href="#/">Exam shelf</a></div>
<div id="message" role="status" aria-live="polite"></div><div id="view"></div></main>
<dialog id="confirm"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="actions"><button id="keep">Keep working</button><button id="proceed" class="primary">Continue</button></div></dialog>
<script>
const BACKEND_URL = "https://exam-scorer.kayuso2011.workers.dev";
const $=id=>document.getElementById(id), names={fce:'B2 First',cae:'C1 Advanced',cpe:'C2 Proficiency',pet:'B1 Preliminary',ket:'A2 Key',ielts:'IELTS Academic',toefl:'TOEFL iBT',ege:'ЕГЭ',oge:'ОГЭ',sat:'SAT'},colors={fce:'#385e45',cae:'#584578',cpe:'#723842',pet:'#3d6174',ket:'#77652c',ielts:'#a4201a',toefl:'#1a56b0',ege:'#17625e',oge:'#8a5a0f',sat:'#2e2458'};
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current=null,state=null,epoch=0,clock=null,audio=null,audioUrl=null,ignoreHash=null,routeVersion=0;
try{$('code').value=localStorage.getItem('examPrepStudentCode')||localStorage.getItem('examPrepCode')||''}catch{}
$('code').onchange=()=>{try{localStorage.setItem('examPrepStudentCode',$('code').value.trim())}catch{}};
function message(text){$('message').textContent=text}
async function api(path,body){const r=await fetch(BACKEND_URL+path,{...(body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error||'The request failed. Please retry.');return d}
function ask(title,text,action){if($('confirm').open)return Promise.resolve(false);$('confirmTitle').textContent=title;$('confirmText').textContent=text;$('proceed').textContent=action;return new Promise(resolve=>{const finish=v=>{$('confirm').close();resolve(v)};$('keep').onclick=()=>finish(false);$('proceed').onclick=()=>finish(true);$('confirm').oncancel=e=>{e.preventDefault();finish(false)};$('confirm').showModal();$('keep').focus()})}
function release(){$("code").disabled=false;$("headerClock").hidden=true;clearInterval(clock);if(audio){audio.pause();audio.removeAttribute('src');audio.load()}audio=null;if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=null;state=null}
function target(){const p=location.hash.replace(/^#\/?/,'').split('/');return {exam:p[0],skill:p[1],hash:location.hash||'#/'};}
function count(){return state?state.answers.filter(a=>Array.isArray(a)?a.length>0:typeof a==='string'?a.trim().length>0:Number.isInteger(a)).length:0}
async function route(){const next=target(),navigation=++routeVersion;if(ignoreHash===next.hash){ignoreHash=null;return}ignoreHash=null;if(state&&!state.done&&count()&&next.hash!==current?.hash){const leave=await ask('Leave this task?','Your answers will be cleared when you leave.','Leave task');if(navigation!==routeVersion||next.hash!==target().hash)return;if(!leave){if(location.hash!==current.hash){ignoreHash=current.hash;location.hash=current.hash}return}}
 release();current=next;const version=++epoch;message('');$('identity').textContent=names[next.exam]||'Reading & Listening';document.documentElement.style.setProperty('--cover',colors[next.exam]||'#1f36a8');
 if(!names[next.exam]){$('view').innerHTML='<h1>Your exam shelf</h1><p class="muted">Choose your book, then a skill. Practice results are not official exam scores.</p><div class="cards">'+Object.entries(names).map(([key,name])=>`<a class="cover" style="--cover:${colors[key]}" href="#/${key}">${escape(name)}<small>Reading${key==='sat'?'':' & Listening'}</small></a>`).join('')+'</div>';return}
 if(!['reading','listening'].includes(next.skill)){$('view').innerHTML=`<div class="paper"><h1>${escape(names[next.exam])}</h1><p>Choose a skill to practise.</p><div class="actions"><a href="#/${next.exam}/reading">Reading</a>${next.exam!=='sat'?`<a href="#/${next.exam}/listening">Listening</a>`:''}</div><p class="muted">Writing and Speaking are available from the <a href="index.html">main practice page</a>.</p></div>`;return}
 $('view').innerHTML='<div class="paper"><h1>'+escape(names[next.exam])+' · '+escape(next.skill)+'</h1><p>Loading practice tasks…</p></div>';
 try{const data=await api(`/section/available?exam=${next.exam}&skill=${next.skill}`);if(version!==epoch)return;
 $('view').innerHTML=`<div class="paper"><h1>${escape(names[next.exam])} · ${escape(next.skill)}</h1><p>Choose a practice exercise. Exercise sizes are for this app; they do not represent a complete exam paper.</p>${data.section?.coverageNote?`<p class="muted">${escape(data.section.coverageNote)}</p>`:''}<div class="toolbar"><label>Working copy<select id="mode"><option value="draft">Draft · practise at your pace</option><option value="fair">Fair copy · exam-style practice</option></select></label></div><div id="groups"></div></div>`;
 for(const g of data.groups){const box=document.createElement('div');box.className='question';box.innerHTML=`<h2>${escape(g.skillDescription)}</h2><p class="muted">${g.itemCount} answers · ${g.approved} approved exercises</p>`;const b=document.createElement('button');b.className='primary';b.textContent=g.available?'Start practice':g.unavailableReason||'Not available yet';b.disabled=!g.available;b.onclick=()=>start(g,b);box.append(b);$('groups').append(box)}
 }catch(e){if(version===epoch)message(e.message)}}
async function start(group,button){const code=$('code').value.trim();if(!code){message('Enter your student code first.');$('code').focus();return}button.disabled=true;$("code").disabled=true;const context={...current},version=++epoch,mode=$('mode').value;
 try{const data=await api('/section/start',{studentCode:code,examKey:context.exam,skill:context.skill,taskFrom:group.taskFrom});if(version!==epoch)return;
 if(data.examKey!==context.exam||data.skill!==context.skill)throw Error('This task belongs to a different exam. Reload the exercise list.');
 release();$('code').value=code;state={...data,studentCode:code,mode,answerCount:data.answers,answers:[],started:performance.now(),requestId:crypto.randomUUID(),done:false};$('code').disabled=true;
 $('view').innerHTML=`<div class="paper"><h1>${escape(names[context.exam])} · ${escape(context.skill)}</h1><p>${escape(data.instructions)} · ${mode==='fair'?'Fair copy':'Draft'}</p>${data.scoringNote?`<p class="notice">${escape(data.scoringNote)}</p>`:''}<div class="toolbar"><span id="elapsed">Elapsed 0:00</span><span id="answered">0 of ${data.answers} answered</span></div><div id="summary" role="status"></div><div class="tabs"><button id="textTab">${context.skill==='listening'?'Audio':'Text'}</button><button id="questionsTab">Questions</button></div><div id="spread" class="spread" data-tab="questions"><section class="text-side"><h2>${context.skill==='listening'?'Audio':'Text'}</h2><div id="text" class="passage"></div><div id="audioHost"></div></section><section class="question-side"><h2>Questions</h2><fieldset id="answers"><div id="questions"></div></fieldset><button id="handin" class="primary">Hand in</button></section></div><div id="after"></div></div>`;
 $('text').textContent=data.passage||'';$('textTab').onclick=()=>$('spread').dataset.tab='text';$('questionsTab').onclick=()=>$('spread').dataset.tab='questions';
 renderQuestions();$('headerClock').hidden=false;$('headerClock').textContent='0:00';$('handin').onclick=handIn;clock=setInterval(()=>{if(!state||state.done)return;const s=Math.floor((performance.now()-state.started)/1000);const time=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;$('elapsed').textContent='Elapsed '+time;$('headerClock').textContent=time},1000);
 if(data.audio){$('spread').dataset.tab='text';await loadAudio(data,version)}
 }catch(e){if(version===epoch)message(e.message)}finally{button.disabled=false;if(!state&&version===epoch)$("code").disabled=false}}
function illustration(item){return item.imageUrl?`<img src="${escape(BACKEND_URL+item.imageUrl)}" alt="${escape(item.imageAlt)}">`:""}
function renderQuestions(){const data=state,host=$('questions');const items=data.format==='matching'?data.items.targets:data.items;
 if(data.format==='matching'){const legend=document.createElement('div');legend.className='question';legend.innerHTML=illustration(data.items)+'<h3>Options</h3>'+data.items.options.map((o,i)=>`<p>${i+1}. ${escape(o)}</p>`).join('')+(data.allowReuse?'<p>An option can be used more than once.</p>':'');host.append(legend)}
 items.forEach((it,i)=>{const box=document.createElement('div');box.className='question';box.innerHTML=`<h3>${i+1}. ${escape(typeof it==='string'?it:it.label||it.q)}</h3>${it.original?`<p>${escape(it.original)}</p><p>Key word: <b>${escape(it.keyword)}</b></p>`:''}${it.stimulus?`<p>${escape(it.stimulus)}</p>`:''}${illustration(it)}`;
 const set=value=>{state.answers[i]=value;$('answered').textContent=`${count()} of ${data.answerCount} answered`};
 if(data.format==='table'){const rule=data.typed;const note=document.createElement('p');note.className='muted';note.textContent=it.keyword?`Use ${it.keyword} unchanged. Write ${rule.minWords}-${rule.maxWords} words in the gap. Standard contractions count as two words.`:it.stem?`Use the correct form of ${it.stem}. Write one word.`:it.prefix?`Complete ${it.prefix}${'_'.repeat(it.missingLetters)}. Type only the missing letters.`:`No more than ${rule.maxWords} ${rule.maxWords===1?'word':'words'}${rule.numberExtra?' and/or a number':''}${rule.articles==='forbidden'?', without articles':''}.`;box.append(note);const input=document.createElement('input');input.type='text';input.maxLength=60;input.autocomplete='off';input.setAttribute('autocapitalize','off');input.setAttribute('autocorrect','off');input.spellcheck=false;input.setAttribute('aria-label',`Answer ${i+1}`);input.oninput=()=>set(input.value);box.append(input)}
 else if(data.format==='matching'){const select=document.createElement('select');select.setAttribute('aria-label',`Answer ${i+1}`);select.innerHTML='<option value="">Choose an option</option>'+data.items.options.map((o,j)=>data.dualMatching&&((i<5&&j>=8)||(i>=5&&j<8))?'':`<option value="${j}">${j+1}. ${escape(o)}</option>`).join('');select.onchange=()=>set(select.value===''?null:Number(select.value));box.append(select)}
 else{if(data.choose){const note=document.createElement('p');note.textContent=`Choose ${data.choose} answers. A practice question counts as right when all choices match.`;box.append(note)}it.options.forEach((option,j)=>{const label=document.createElement('label');label.className='choice';const input=document.createElement('input');input.type=data.format==='multiselect'?'checkbox':'radio';input.name=`q${i}`;input.onchange=()=>{if(data.format==='multiselect'){const values=[...box.querySelectorAll('input:checked')].map(x=>Number(x.value));if(values.length>data.choose){input.checked=false;message(`Choose no more than ${data.choose} answers.`);return}set(values)}else set(j)};input.value=j;label.append(input,document.createTextNode(option));box.append(label)})}host.append(box)})}
async function loadAudio(data,version){$('audioHost').innerHTML='<p>Loading audio…</p>';try{const url=new URL(data.audio,BACKEND_URL);if(url.origin!==new URL(BACKEND_URL).origin)throw Error('Invalid audio address');const r=await fetch(url);if(!r.ok)throw Error('Audio could not be loaded. Please retry.');const blob=await r.blob();if(version!==epoch||!state)return;audioUrl=URL.createObjectURL(blob);audio=new Audio(audioUrl);audio.onerror=()=>message('This recording could not be played. Retry or choose another exercise.');$('audioHost').innerHTML='';if(state.mode==='draft'){audio.controls=true;$('audioHost').append(audio)}else{const play=document.createElement('button');play.textContent='Play recording';let played=false,finished=false;const clip=audio,owner=state;clip.onended=()=>{finished=true;play.disabled=true;clip.removeAttribute('src');clip.load();play.textContent='Recording finished'};clip.onpause=()=>{if(played&&!finished&&state===owner&&!owner.done){play.disabled=false;play.textContent='Resume recording';message('Playback was interrupted. Resume continues from the current position.')}};play.onclick=async()=>{if(finished||played&&!clip.paused)return;play.disabled=true;try{await clip.play();played=true;play.textContent='Recording started'}catch{play.disabled=false;message('Playback was blocked. Tap Play recording again.')}};$('audioHost').append(play);const note=document.createElement('p');note.textContent='One complete playback. Any repeated recordings and pauses are included in the file.';$('audioHost').append(note)}const credit=document.createElement('p');credit.className='muted';credit.textContent=data.audioCredit||'';$('audioHost').append(credit)}catch(e){if(version!==epoch)return;message(e.message);const retry=document.createElement('button');retry.textContent='Retry audio';retry.onclick=()=>loadAudio(data,version);$('audioHost').replaceChildren(retry)}}
async function handIn(){if(!state||state.done||state.sending)return;const work=state;if(!work.payload&&count()<work.answerCount&&!await ask('Hand in with blanks?',`${work.answerCount-count()} answers are blank. They will receive no mark.`,'Hand in'))return;
 if(!work.payload)work.payload={studentCode:work.studentCode,bankId:work.bankId,requestId:work.requestId,secondsSpent:Math.min(86400,Math.floor((performance.now()-work.started)/1000)),answers:Array.from({length:work.answerCount},(_,i)=>work.answers[i]??null)};
 work.sending=true;$('handin').disabled=true;$('answers').disabled=true;const version=epoch;message('Saving your answers…');
 try{const result=await api('/section/submit',work.payload);if(version!==epoch||state!==work)return;work.done=true;clearInterval(clock);if(audio)audio.pause();$('handin').hidden=true;message('');showResult(result)}catch(e){if(version===epoch){message(e.message+' Your submission is kept here. Retry sends the same answers.');$('handin').textContent='Retry hand-in';$('handin').disabled=false}}finally{work.sending=false}}
function showResult(result){$('summary').innerHTML=`<div class="notice"><h2>${result.correct} of ${result.total} right${result.pending?` · ${result.pending} waiting for review`:''}</h2><p>Practice marking. The real exam’s reference answers may be stricter or different. This result is not an official exam score.</p>${result.scoringNote?`<p>${escape(result.scoringNote)}</p>`:''}</div>`;
 const host=$('after');host.innerHTML='<h2>Your answers</h2>';result.perItem.forEach((item,i)=>{const box=document.createElement('div');box.className='result-line';const key=Array.isArray(result.items)?result.items[i]:null;const expected=key?.accepted?.join(' / ')??(Array.isArray(key?.answer)?key.answer.map(n=>key.options[n]).join(' / '):result.items?.options?result.items.options[item.expected]:key?.options?.[item.expected]);box.innerHTML=`<p class="${item.correct?'right':item.state==='pending'?'waiting':'wrong'}"><b>${i+1}. ${item.correct?'Right':item.state==='pending'?"Not in our answer list. We’ll check it. If it’s valid your score goes up.":(item.reason==='empty'||item.chosen==null)?'Blank':'Not right'}</b></p><p>Your answer: ${escape(Array.isArray(item.chosen)?item.chosen.map(n=>key?.options?.[n]||String(n+1)).join(', '):typeof item.chosen==='number'?(key?.options?.[item.chosen]||result.items?.options?.[item.chosen]||String(item.chosen+1)):item.chosen||'Blank')}</p>${expected?`<p>Answer: ${escape(expected)}</p>`:''}<p>${escape(key?.why||result.items?.why?.[i]||'')}</p>${!item.correct&&typeof item.chosen==='number'&&key?.whyNot?.[item.chosen]?`<p>Why your answer is not right: ${escape(key.whyNot[item.chosen])}</p>`:''}`;host.append(box)});
 if(result.transcript){const transcript=document.createElement('details');transcript.innerHTML='<summary>Read the transcript</summary><div class="passage"></div>';transcript.lastElementChild.textContent=result.transcript;host.append(transcript)}const again=document.createElement('button');again.textContent='Another exercise';again.onclick=()=>{state.done=true;route()};host.append(again);$('code').disabled=false;$('summary').scrollIntoView({block:'start'})}
$('progress').onclick=async()=>{const code=$('code').value.trim();if(!code){message('Enter your student code first.');return}if(state&&!state.done&&count()&&!await ask('Leave this task?','Your answers will be cleared.','View progress'))return;release();$('code').disabled=false;const version=++epoch;try{const data=await api(`/student/${encodeURIComponent(code)}/sections`);if(version!==epoch)return;$('view').innerHTML='<div class="paper"><h1>Your progress</h1><div id="history"></div></div>';if(!data.attempts.length)$('history').textContent='Your completed Reading and Listening exercises will appear here.';for(const a of data.attempts){const item=document.createElement('details');item.className='question';item.innerHTML=`<summary>${escape(names[a.examKey]||a.examKey)} · ${escape(a.skill)}${a.taskFrom?` · part/profile ${a.taskFrom}`:''} · ${a.correct}/${a.total}${a.pending?' · review pending':''}</summary><p>${escape(a.createdAt)}${a.secondsSpent!=null?` · ${Math.floor(a.secondsSpent/60)}m ${a.secondsSpent%60}s`:''}</p>`;$('history').append(item)}}catch(e){message(e.message)}};
window.addEventListener('hashchange',()=>route());window.addEventListener('beforeunload',e=>{if(state&&!state.done&&count()){e.preventDefault();e.returnValue=''}});route();
</script>
</body></html>
