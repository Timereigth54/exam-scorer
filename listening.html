<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Listening papers · Exam Prep</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="ui.css">
  <style>
    .listening-page { margin: 0; padding: clamp(1rem, 4vw, 3rem); }
    .listening-page main { max-width: 65rem; margin-inline: auto; }
    .listening-page nav a { display: inline-flex; align-items: center; min-height: 44px; }
    .listening-page h1 { margin: .5rem 0 1.2rem; }
    .listening-page h2 { margin: 0 0 .6rem; }
    .listening-page p { margin: .45rem 0; }
    .listening-page .card { border: 1px solid var(--ui-border); border-radius: var(--ui-radius); background: var(--ui-paper); padding: clamp(1rem, 3vw, 1.6rem); }
    .listening-page .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: .75rem; }
    .listening-page .fields label { display: grid; gap: .25rem; font-weight: 700; }
    .listening-page :is(input:not([type=radio]), select, button) { border: 1px solid var(--ui-control); border-radius: .55rem; padding: .55rem .8rem; background: var(--ui-paper); font: inherit; }
    .listening-page button { cursor: pointer; font-weight: 700; }
    .listening-page button:disabled { opacity: .55; }
    .listening-page button.primary { border-color: var(--ui-accent); }
    .listening-page .actions { display: flex; align-items: center; flex-wrap: wrap; gap: .7rem; margin-top: .8rem; }
    .listening-page #player { margin: 1rem 0; }
    .listening-page #status:empty { display: none; }
    .listening-page #status[data-error] { color: var(--ui-danger); }
    .listening-page #paper-parts > section { margin-top: 1rem; }
    .listening-page fieldset { margin: .7rem 0; border: 1px solid var(--ui-border); border-radius: .55rem; padding: .7rem; min-width: 0; }
    .listening-page legend { font-weight: 700; overflow-wrap: anywhere; max-width: 100%; }
    .listening-page .option { display: flex; gap: .5rem; align-items: center; min-height: 42px; }
    .listening-page .option:has(img) { flex-wrap: wrap; }
    .listening-page img { max-width: min(100%, 12rem); border: 1px solid var(--ui-border); border-radius: .4rem; }
    .listening-page table { border-collapse: collapse; width: 100%; }
    .listening-page .review li { padding: .65rem 0; border-top: 1px solid var(--ui-border); }
    .listening-page .wrong { color: var(--ui-danger); }
    .listening-page summary { cursor: pointer; min-height: 44px; padding-top: .45rem; }
  </style>
</head>
<body class="exam-ui listening-page">
<main>
  <nav aria-label="Exam Prep"><a href="index.html">← Exam Prep</a></nav>
  <h1>Full Listening papers</h1>
  <p id="status" role="status" aria-live="polite"></p>
  <form id="setup" class="card">
    <div class="fields">
      <label>Your code<input id="student" required autocomplete="off" placeholder="e.g. FX7-K2N"></label>
      <label>Exam<select id="exam" required></select></label>
    </div>
    <p id="exam-notes" class="hint"></p>
    <div class="actions">
      <button type="button" id="reload" hidden>Reload exams</button>
      <button class="primary" id="start" disabled>Start a Listening paper</button>
    </div>
  </form>
  <section id="attempt" hidden>
    <h2 id="paper-title" tabindex="-1"></h2>
    <p id="paper-note" class="hint"></p>
    <div id="player" class="card">
      <p id="track-status" role="status"></p>
      <p id="track-credit" class="hint" hidden></p>
      <div class="actions">
        <button class="primary" type="button" id="play">Play recordings</button>
        <button type="button" id="jump" disabled>Go to current part</button>
      </div>
      <audio id="audio" preload="none"></audio>
    </div>
    <form id="question-form">
      <div id="paper-parts"></div>
      <div class="actions">
        <button class="primary" id="submit">Submit paper</button>
        <p id="answered" class="hint"></p>
      </div>
    </form>
  </section>
  <section id="results" class="card" hidden>
    <h2 id="score" tabindex="-1"></h2>
    <p id="score-note" class="hint"></p>
    <div class="review" id="review"></div>
    <button class="primary" type="button" id="again">Choose another paper</button>
  </section>
</main>
<script>
const BACKEND_URL = "https://exam-scorer.kayuso2011.workers.dev";
const $ = (id) => document.getElementById(id);
const storageKey = "examPrepStudentCode";
let exams = [];
let paper = null;
let answers = [];
let tracks = [];
let trackIndex = 0;
let activePart = 0;
let busy = false;
const audio = $("audio");

function status(message = "", error = false) {
  $("status").textContent = message;
  $("status").toggleAttribute("data-error", error);
}
function element(tag, value) {
  const node = document.createElement(tag);
  if (value !== undefined) node.textContent = value;
  return node;
}
async function api(path, body) {
  const response = await fetch(BACKEND_URL + "/listening-papers/" + path, body ? {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  } : {});
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || "Something went wrong. Try again.");
  return data;
}

function updateExam() {
  const exam = exams.find((item) => item.key === $("exam").value);
  $("start").disabled = !exam || exam.paperCount === 0;
  $("exam-notes").textContent = exam
    ? exam.questions + " questions · About " + exam.minutes + " minutes · " + exam.paperCount + " approved papers"
    : "";
}
async function loadExams() {
  $("reload").hidden = true;
  status("Loading exams…");
  try {
    ({ exams } = await api("overview"));
    $("exam").replaceChildren(...exams.map((exam) => {
      const option = element("option", exam.label + (exam.paperCount ? "" : " · not yet available"));
      option.value = exam.key;
      return option;
    }));
    const available = exams.find((exam) => exam.paperCount > 0);
    const requested = new URLSearchParams(location.search).get("exam");
    $("exam").value = exams.some((exam) => exam.key === requested) ? requested : (available || exams[0])?.key;
    updateExam();
    status();
  } catch (error) {
    $("reload").hidden = false;
    status(error.message || "Couldn't load Listening exams.", true);
  }
}
function updateAnswered() {
  $("answered").textContent = answers.filter((answer) => answer !== null && answer !== "").length + " of " + answers.length + " answered";
}
function answerKey() {
  return "listening-paper:" + paper.attemptId + ":" + paper.stage;
}
function saveAnswers() {
  try { sessionStorage.setItem(answerKey(), JSON.stringify(answers)); } catch (_) {}
  updateAnswered();
}
function renderPart(part, sectionIndex, offset) {
  const section = element("section");
  section.className = "card";
  section.id = "paper-part-" + sectionIndex;
  const heading = element("h2", part.title);
  heading.tabIndex = -1;
  section.append(heading, element("p", part.instructions));
  for (const [localIndex, item] of part.items.entries()) {
    const index = offset + localIndex;
    const question = element("fieldset");
    question.append(element("legend", (paper.questionOffset + index + 1) + ". " + item.prompt));
    if (item.kind === "typed") {
      const input = element("input");
      input.maxLength = 60;
      input.autocomplete = "off";
      input.spellcheck = false;
      input.setAttribute("aria-label", "Answer " + (paper.questionOffset + index + 1));
      input.value = answers[index] || "";
      input.addEventListener("input", () => { answers[index] = input.value; saveAnswers(); });
      question.append(input);
    } else {
      item.options.forEach((option, choice) => {
        const label = element("label");
        label.className = "option";
        const input = element("input");
        input.type = "radio";
        input.name = "answer-" + index;
        input.checked = answers[index] === choice;
        input.addEventListener("change", () => { answers[index] = choice; saveAnswers(); });
        label.append(input, element("span", option));
        if (item.images?.[choice]) {
          const image = element("img");
          image.src = BACKEND_URL + item.images[choice];
          image.alt = "Picture " + String.fromCharCode(65 + choice);
          label.append(image);
        }
        question.append(label);
      });
    }
    section.append(question);
  }
  return section;
}
function pauseAudio() {
  audio.pause();
  audio.removeAttribute("src");
  audio.load();
}
function renderPaper() {
  pauseAudio();
  trackIndex = 0;
  activePart = 0;
  tracks = paper.parts.flatMap((part, sectionIndex) => part.recordings.map((track, index) => ({
    ...track, sectionIndex, title: part.title, partTrack: index + 1, partTracks: part.recordings.length,
  })));
  const count = paper.parts.reduce((n, part) => n + part.items.length, 0);
  answers = Array(count).fill(null);
  try {
    const saved = JSON.parse(sessionStorage.getItem(answerKey()));
    if (Array.isArray(saved) && saved.length === count) answers = saved;
  } catch (_) {}
  $("paper-title").textContent = paper.title;
  $("paper-note").textContent = paper.scoreNote;
  $("track-status").textContent = paper.plays === 2 ? "Each recording contains two plays." : "Each recording plays once.";
  $("track-credit").hidden = true;
  $("play").disabled = false;
  $("play").textContent = "Play recordings";
  $("jump").disabled = true;
  $("submit").textContent = paper.stage === "router" ? "Continue to second module" : "Submit paper";
  let offset = 0;
  $("paper-parts").replaceChildren(...paper.parts.map((part, index) => {
    const section = renderPart(part, index, offset);
    offset += part.items.length;
    return section;
  }));
  $("setup").hidden = true;
  $("attempt").hidden = false;
  updateAnswered();
  $("paper-title").focus();
}
async function playTrack() {
  const track = tracks[trackIndex];
  if (!track) {
    $("track-status").textContent = "All recordings finished.";
    $("play").textContent = "Recordings finished";
    $("play").disabled = true;
    $("track-credit").hidden = true;
    return;
  }
  const trackUrl = BACKEND_URL + track.audio;
  if (audio.src !== trackUrl) audio.src = trackUrl;
  activePart = track.sectionIndex;
  $("jump").disabled = false;
  $("track-status").textContent = track.title + " · Recording " + track.partTrack + " of " + track.partTracks
    + (track.renderedWith === "kokoro" ? " · Kokoro preview voice" : "");
  $("track-credit").textContent = track.credit || "";
  $("track-credit").hidden = !track.credit;
  try {
    await audio.play();
    $("play").textContent = "Pause recordings";
  } catch (_) {
    $("play").textContent = "Resume recordings";
  }
}
function renderResult(result) {
  pauseAudio();
  $("attempt").hidden = true;
  $("results").hidden = false;
  $("score").textContent = result.points + " of " + result.maxPoints + " points";
  $("score-note").textContent = result.correct + " of " + result.total + " correct. " + result.scoreNote;
  $("review").replaceChildren(...result.parts.map((part) => {
    const section = element("section");
    section.append(element("h3", part.title + " · " + part.correct + " of " + part.total + " correct"));
    const list = element("ol");
    part.items.forEach((item) => {
      const line = element("li");
      const mark = element("strong", item.correct ? "Correct" : "Incorrect");
      mark.className = item.correct ? "" : "wrong";
      line.append(element("p", item.prompt), mark, element("p", "Your answer: " + (item.selected ?? "—") + " · Key: " + item.answer),
        element("p", item.explanation));
      list.append(line);
    });
    const transcript = element("details");
    transcript.append(element("summary", "Show transcripts"));
    part.transcripts.forEach((recording, index) => {
      transcript.append(element("h4", "Recording " + (index + 1)));
      recording.forEach(({ speaker, text }) => transcript.append(element("p", speaker + ": " + text)));
    });
    section.append(list, transcript);
    return section;
  }));
  $("score").focus();
}

try { $("student").value = localStorage.getItem(storageKey) || ""; } catch (_) {}
$("exam").addEventListener("change", updateExam);
$("reload").addEventListener("click", loadExams);
$("setup").addEventListener("submit", async (event) => {
  event.preventDefault();
  if (busy || $("start").disabled) return;
  const studentCode = $("student").value.trim();
  if (!studentCode) { status("Enter your student code.", true); return; }
  try { localStorage.setItem(storageKey, studentCode); } catch (_) {}
  busy = true;
  $("start").disabled = true;
  status("Finding an unused paper…");
  try {
    paper = { ...(await api("start", { studentCode, examKey: $("exam").value })), studentCode };
    status();
    renderPaper();
  } catch (error) { status(error.message, true); }
  finally { busy = false; updateExam(); }
});
$("play").addEventListener("click", () => {
  if (audio.paused) void playTrack();
  else { audio.pause(); $("play").textContent = "Resume recordings"; }
});
$("jump").addEventListener("click", () => $("paper-part-" + activePart)?.querySelector("h2")?.focus());
audio.addEventListener("ended", () => { trackIndex++; void playTrack(); });
audio.addEventListener("error", () => {
  if (!audio.getAttribute("src")) return;
  audio.removeAttribute("src");
  $("play").textContent = "Retry recording";
  $("track-status").textContent = "The recording couldn't be loaded. Try again.";
});
$("question-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  if (busy || !paper) return;
  busy = true;
  $("submit").disabled = true;
  audio.pause();
  $("play").textContent = "Resume recordings";
  status(paper.stage === "router" ? "Preparing the second module…" : "Checking your answers…");
  try {
    const { attemptId, studentCode, stage } = paper;
    const result = await api("submit", { attemptId, studentCode, stage, answers });
    try { sessionStorage.removeItem(answerKey()); } catch (_) {}
    status();
    if (result.stage === "scored") renderResult(result.result);
    else { paper = { ...paper, ...result }; renderPaper(); }
  } catch (error) { status(error.message, true); }
  finally { busy = false; $("submit").disabled = false; }
});
$("again").addEventListener("click", () => {
  paper = null;
  $("results").hidden = true;
  $("setup").hidden = false;
  $("start").focus();
});
loadExams();
</script>
</body>
</html>
